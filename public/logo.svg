<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c252"/>
      <stop offset="50%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  <!-- Background shield shape -->
  <path d="M256 16 L472 96 L472 272 Q472 416 256 496 Q40 416 40 272 L40 96 Z"
        fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="8"/>
  <!-- Inner border -->
  <path d="M256 40 L452 112 L452 268 Q452 400 256 472 Q60 400 60 268 L60 112 Z"
        fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.3"/>
  <!-- Large A letterform -->
  <path d="M256 100 L148 380 L188 380 L212 316 L300 316 L324 380 L364 380 Z
           M224 284 L256 192 L288 284 Z"
        fill="url(#gold-grad)" fill-rule="evenodd" opacity="0.35"/>
  <!-- W overlaid on top -->
  <path d="M130 160 L180 340 L230 220 L256 300 L282 220 L332 340 L382 160
           L352 160 L318 280 L282 180 L256 260 L230 180 L194 280 L160 160 Z"
        fill="url(#gold-grad)"/>
  <!-- Small decorative swords crossing below -->
  <line x1="200" y1="400" x2="312" y2="400" stroke="url(#gold-grad)" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="388" x2="256" y2="412" stroke="url(#gold-grad)" stroke-width="2" opacity="0.5"/>
</svg>
